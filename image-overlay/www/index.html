<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenWrt</title>
    <script>
      fetch('/cgi-bin/firstboot-setup?action=status', { cache: 'no-store' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          window.location.replace(data.complete ? '/cgi-bin/luci/' : '/setup/?v=0.8.0-ux-health-3');
        })
        .catch(function() {
          window.location.replace('/setup/?v=0.8.0-ux-health-3');
        });
    </script>
  </head>
  <body>
    <a href="/setup/">OpenWrt Setup</a>
  </body>
</html>
