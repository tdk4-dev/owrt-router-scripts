<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Premier Router</title>
    <script>
      fetch('/cgi-bin/firstboot-setup?action=status', { cache: 'no-store' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          window.location.replace(data.complete ? '/cgi-bin/luci/' : '/setup/?v=0.8.0-reset-progress-2');
        })
        .catch(function() {
          window.location.replace('/setup/?v=0.8.0-reset-progress-2');
        });
    </script>
  </head>
  <body>
    <a href="/setup/">Premier Router setup</a>
  </body>
</html>
