name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install release-test tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake libjson-c-dev
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          UCODE_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-ucode.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate shell scripts
        run: |
          sh -n \
            bootstrap-router-ui-ipk-install.sh \
            luci-vpn-ui/install.sh \
            luci-vpn-ui/files/usr/sbin/vpn-ui \
            luci-vpn-ui/files/usr/sbin/vpn-ui-readonly \
            luci-vpn-ui/files/usr/sbin/vpn-ui-update \
            luci-vpn-ui/files/usr/libexec/premier-router/update-lib.sh \
            luci-vpn-ui/files/usr/libexec/premier-router/candidate-validator \
            luci-vpn-ui/files/etc/init.d/premier-router-update-recovery \
            install-router-ui-release.sh \
            rescue-router-ui.sh \
            install-openwrt-vpn-ui.sh \
            install-friend-vpn-panel.sh \
            make-vpn-ui-release-bundle.sh \
            scripts/build-openwrt-ipks.sh \
            scripts/install-ci-ucode.sh \
            scripts/release-key-lib.sh \
            scripts/sign-in-linux-build-vm.sh \
            scripts/sign-opkg-feed.sh \
            scripts/sign-release-inputs.sh \
            scripts/derive-rd23-storage-layout.sh \
            scripts/patch-openwrt-x86-writable-extent.sh \
            scripts/stage-factory-schema2-contract.sh \
            scripts/stage-installed-package-set.sh \
            scripts/stage-router-release.sh \
            scripts/validate-staged-release.sh \
            scripts/verify-release-signature.sh \
            tests/test-factory-schema2-staging.sh \
            tests/test-local-signing-key-lifecycle.sh \
            tests/test-recovery-lock-reproducer.sh \
            tests/test-rc6-virtualbox-evidence.sh \
            tests/test-security-boundaries-0.7.11.sh \
            tests/test-updater-worker-start.sh \
            tests/test-xray-adopted-overlay.sh \
            tests/test-vm-controller-contract.sh \
            tests/test-vm-listener-normalization.sh \
            tests/integration/validate-rc6-virtualbox-evidence.sh \
            tests/vm/build-synthetic-next.sh \
            tests/vm/baseline-contract-digest.sh \
            tests/vm/router-ui-vm-guest.sh \
            tests/vm/write-candidate-content-descriptor.sh \
            build-openwrt-custom-image-linux.sh \
            build-openwrt-x86-fin0-image-linux.sh
          bash -n \
            publish-vpn-panel-release.sh \
            scripts/create-local-rc-bundle.sh \
            tests/vm/aggregate-candidate-evidence.sh \
            tests/vm/download-immutable-actions-artifact.sh \
            tests/vm/fail-closed-runner.sh \
            tests/vm/recovery-readiness.sh \
            tests/vm/run-preimage-rescue-smoke.sh \
            tests/vm/router-ui-vm-gate.sh \
            tests/test-vm-recovery-readiness.sh

      - name: Validate JavaScript
        run: |
          node --check luci-vpn-ui/files/www/luci-static/resources/view/network/vpn.js
          node --check luci-vpn-ui/files/www/luci-static/resources/view/network/tailscale.js
          node --check luci-vpn-ui/files/www/luci-static/resources/view/system/update.js
          node --check luci-vpn-ui/files/www/luci-static/resources/view/status/include/35_vpn.js
          node --check firstboot-wizard/server.mjs
          node --check firstboot-wizard/www/app.js
          node --check tests/test-vpn-luci-adopted-apply.mjs
          node --check tests/vm/check-status-card.cjs

      - name: Run local tests
        run: |
          sh tests/test-vpn-hotfixes.sh
          sh tests/test-luci-stable-assets.sh
          sh tests/test-release-publisher.sh
          bash tests/test-candidate-evidence-aggregation.sh
          sh tests/test-factory-schema2-staging.sh
          sh tests/test-local-signing-key-lifecycle.sh
          sh tests/test-recovery-lock-reproducer.sh
          sh tests/test-rc6-virtualbox-evidence.sh
          sh tests/test-router-ui-release-v2.sh
          sh tests/test-security-boundaries-0.7.11.sh
          sh tests/test-updater-transaction-v2.sh
          sh tests/test-updater-worker-start.sh
          sh tests/test-xray-adopted-overlay.sh
          sh tests/test-rescue-support-matrix.sh
          sh tests/test-image-package-identity.sh
          sh tests/test-vm-architecture.sh
          sh tests/test-vm-controller-contract.sh
          sh tests/test-vm-listener-normalization.sh
          bash tests/test-vm-recovery-readiness.sh
          node tests/test-tailscale-ping-ui.mjs
          node tests/test-vpn-luci-adopted-apply.mjs
