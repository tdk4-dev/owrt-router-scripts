name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/router-ui-source-preflight.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
