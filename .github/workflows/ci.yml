name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/router-ui-source-preflight.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
