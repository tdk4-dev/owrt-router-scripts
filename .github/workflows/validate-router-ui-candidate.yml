name: Validate production-signed Router UI candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 0.7.11 release source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: router-ui-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  canonical-ipks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact clean 0.7.11 source
        run: |
          printf '%s' '${{ inputs.source_sha }}' | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          test "$(sed -n '1p' luci-vpn-ui/VERSION)" = 0.7.11
          test "$(sed -n '1p' luci-vpn-ui/files/usr/share/vpn-ui/version)" = 0.7.11
          test -z "$(git status --porcelain)"
      - name: Build canonical IPKs twice and retain the first bytes
        env:
          RELEASE_PUBLIC_KEY: ${{ github.workspace }}/release/keys/router-ui-production.pub
          STRICT_RELEASE: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          export USIGN_BIN="$RUNNER_TEMP/bin/usign"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DIRTY=false
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          BUILD_DIR="$RUNNER_TEMP/ipk-build-a" OUT_DIR="$RUNNER_TEMP/ipk-a" \
            FEED_DIR="$RUNNER_TEMP/feed-a" ./scripts/build-openwrt-ipks.sh
          BUILD_DIR="$RUNNER_TEMP/ipk-build-b" OUT_DIR="$RUNNER_TEMP/ipk-b" \
            FEED_DIR="$RUNNER_TEMP/feed-b" ./scripts/build-openwrt-ipks.sh
          diff -u "$RUNNER_TEMP/ipk-a/router-ui-packages.txt" "$RUNNER_TEMP/ipk-b/router-ui-packages.txt"
          for file in "$RUNNER_TEMP/ipk-a"/*.ipk; do
            cmp -s "$file" "$RUNNER_TEMP/ipk-b/$(basename "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-canonical-router-ui-ipks
          path: ${{ runner.temp }}/ipk-a/
          if-no-files-found: error
          retention-days: 30

  sign-installed-package-set:
    needs: canonical-ipks
    runs-on: ubuntu-24.04
    environment: router-ui-production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - name: Sign the exact initial package rollback set
        env:
          RELEASE_SECRET_KEY_DATA: ${{ secrets.ROUTER_UI_USIGN_SECRET_KEY }}
          SIGNING_KEY: ${{ runner.temp }}/release.sec
          IPK_DIR: ${{ runner.temp }}/canonical-ipks
          OUT_DIR: ${{ runner.temp }}/installed-package-set
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          cleanup_secret() { rm -f "$SIGNING_KEY"; }
          trap cleanup_secret EXIT INT TERM
          printf '%s\n' "$RELEASE_SECRET_KEY_DATA" > "$SIGNING_KEY"
          chmod 600 "$SIGNING_KEY"
          export USIGN_BIN="$RUNNER_TEMP/bin/usign"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-installed-package-set.sh
          cleanup_secret
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set/
          if-no-files-found: error
          retention-days: 30

  images:
    needs: [canonical-ipks, sign-installed-package-set]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            target: x86/64
            profile: generic
            rootfs_partsize: 60
            writable_budget_kib: 61440
          - name: rd23-stock
            target: mediatek/filogic
            profile: xiaomi_mi-router-ax3000t-stock
            rootfs_partsize: 0
            writable_budget_kib: 61440
          - name: rd23-ubootmod
            target: mediatek/filogic
            profile: xiaomi_mi-router-ax3000t-ubootmod
            rootfs_partsize: 0
            writable_budget_kib: 87040
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: candidate-signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set
      - name: Build image only from the canonical IPKs
        env:
          TARGET_DIR: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
          PROJECT_PACKAGE_DIR: ${{ runner.temp }}/canonical-ipks
          PROJECT_PACKAGE_MANIFEST: ${{ runner.temp }}/canonical-ipks/router-ui-packages.txt
          INSTALLED_PACKAGE_SET_DIR: ${{ runner.temp }}/installed-package-set
          OUT_DIR: ${{ runner.temp }}/images
          WORK_DIR: ${{ runner.temp }}/imagebuilder
          ROOTFS_PARTSIZE: ${{ matrix.rootfs_partsize }}
          WRITABLE_BUDGET_KIB: ${{ matrix.writable_budget_kib }}
        run: |
          sudo apt-get update && sudo apt-get install -y zstd jq
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DIRTY=false
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./build-openwrt-custom-image-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-router-image-${{ matrix.name }}
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          retention-days: 30

  assemble-and-sign:
    needs: images
    runs-on: ubuntu-24.04
    environment: router-ui-production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-router-image-*
          path: ${{ runner.temp }}/stage-root
          merge-multiple: true
      - name: Assemble, sign, validate, and build a distinct synthetic next target
        env:
          RELEASE_SECRET_KEY_DATA: ${{ secrets.ROUTER_UI_USIGN_SECRET_KEY }}
          SIGNING_KEY: ${{ runner.temp }}/release.sec
          IPK_DIR: ${{ runner.temp }}/canonical-ipks
          OUT_ROOT: ${{ runner.temp }}/stage-root
          RELEASE_DIR: ${{ runner.temp }}/release-v0.7.11
          OUTPUT_DIR: ${{ runner.temp }}/synthetic-next
          STRICT_RELEASE: "1"
          REQUIRE_IMAGES: "1"
          REQUIRE_MAIN_ANCESTRY: "0"
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          cleanup_secret() { rm -f "$SIGNING_KEY"; }
          trap cleanup_secret EXIT INT TERM
          printf '%s\n' "$RELEASE_SECRET_KEY_DATA" > "$SIGNING_KEY"
          chmod 600 "$SIGNING_KEY"
          export USIGN_BIN="$RUNNER_TEMP/bin/usign"
          export RELEASE_PUBLIC_KEY="$GITHUB_WORKSPACE/release/keys/router-ui-production.pub"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export EXPECTED_SOURCE_COMMIT="$SOURCE_COMMIT"
          export SOURCE_DIRTY=false
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-router-release.sh
          ./scripts/validate-staged-release.sh
          ./tests/vm/build-synthetic-next.sh
          cleanup_secret
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-verified-flat-release
          path: ${{ runner.temp }}/release-v0.7.11/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-synthetic-next
          path: ${{ runner.temp }}/synthetic-next/
          if-no-files-found: error
          retention-days: 30

  constrained-vm-gate:
    needs: assemble-and-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-verified-flat-release
          path: ${{ runner.temp }}/release-v0.7.11
      - uses: actions/download-artifact@v4
        with:
          name: candidate-synthetic-next
          path: ${{ runner.temp }}/synthetic-next
      - name: Install VM and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils jq openssl zstd cmake nodejs npm
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.55.1
          npx --prefix "$RUNNER_TEMP/playwright" playwright install --with-deps chromium
      - name: Run the serial 256 MiB and 60 MiB constrained VM matrix
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-v0.7.11
          SYNTHETIC_DIR: ${{ runner.temp }}/synthetic-next
          EVIDENCE_DIR: ${{ runner.temp }}/candidate-evidence
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
        run: |
          x86_archive="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*x86-64.tar.gz' | sed -n '1p')"
          test -n "$x86_archive"
          export X86_IMAGE_ARCHIVE="$x86_archive"
          ./tests/vm/router-ui-vm-gate.sh
          (cd "$RELEASE_DIR" && sha256sum ./* | sed 's#  \./#  #' > "$EVIDENCE_DIR/candidate-asset-sha256sums")
          cp "$RELEASE_DIR/router-release-manifest.json" "$EVIDENCE_DIR/"
          cp "$RELEASE_DIR/router-ui-packages.txt" "$EVIDENCE_DIR/"
          (cd "$EVIDENCE_DIR" && sha256sum ./* > evidence-files-sha256sums)
      - uses: actions/upload-artifact@v4
        with:
          name: pretag-router-ui-candidate-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/release-v0.7.11/
            ${{ runner.temp }}/synthetic-next/
            ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 30
