name: Prepare Router UI package-only candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source and workflow commit SHA
        required: true
        type: string
      app_version:
        description: Expected application version (RC23 or future stable)
        required: true
        default: 0.7.11-rc.23
        type: string
      package_version:
        description: Expected opkg version
        required: true
        default: 0.7.11~rc23-1
        type: string
      channel:
        description: Expected channel
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
      custody_confirmed:
        description: Operator confirms two verified encrypted backups and recovery proof exist
        required: true
        default: false
        type: boolean
      custody_record_sha256:
        description: SHA-256 of the private operator custody record (never its contents or location)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: router-ui-package-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  APP_VERSION: ${{ inputs.app_version }}
  PACKAGE_VERSION: ${{ inputs.package_version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  ROUTER_UI_SIGNING_KEY_ID: production-2026-07
  LC_ALL: C
  TZ: UTC

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact identity and completed custody before any build
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          CUSTODY_CONFIRMED: ${{ inputs.custody_confirmed }}
          CUSTODY_RECORD_SHA256: ${{ inputs.custody_record_sha256 }}
        run: |
          set -eu
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          case "$APP_VERSION:$PACKAGE_VERSION:$RELEASE_CHANNEL" in
            0.7.11-rc.23:0.7.11~rc23-1:candidate|0.7.11:0.7.11-1:stable) ;;
            *) echo 'Unsupported expected package-candidate identity' >&2; exit 1 ;;
          esac
          test "$CUSTODY_CONFIRMED" = true
          printf '%s' "$CUSTODY_RECORD_SHA256" | grep -Eq '^[0-9a-f]{64}$'

  source-preflight:
    needs: validate-inputs
    uses: ./.github/workflows/router-ui-source-preflight.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  canonical-ipks:
    name: canonical-ipks-${{ matrix.side }}
    needs: [validate-inputs, source-preflight]
    if: ${{ needs.source-preflight.outputs.verified_sha == inputs.source_sha }}
    strategy:
      fail-fast: true
      matrix:
        side: [a, b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify independent clean checkout identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ needs.source-preflight.outputs.verified_tree }}
        run: |
          python3 scripts/verify-router-ui-package-candidate.py source \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --app-version "$APP_VERSION" --package-version "$PACKAGE_VERSION" \
            --channel "$RELEASE_CHANNEL" > "$RUNNER_TEMP/source-identity.json"
      - name: Build one independent canonical package set
        env:
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          STRICT_RELEASE: '1'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          test "$(tar --version | head -n1)" = 'tar (GNU tar) 1.35'
          test "$(gzip --version | head -n1)" = 'gzip 1.12'
          test "$(jq --version)" = 'jq-1.7'
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          BUILD_DIR="$RUNNER_TEMP/build" OUT_DIR="$RUNNER_TEMP/artifacts/ipk" \
            FEED_DIR="$RUNNER_TEMP/artifacts/feed" ./scripts/build-openwrt-ipks.sh
          test -z "$(git status --porcelain)"
          cp "$RUNNER_TEMP/source-identity.json" "$RUNNER_TEMP/artifacts/source-identity.json"
          { uname -a; git --version; tar --version | head -n1; gzip --version | head -n1; jq --version;
            python3 --version; cmake --version | head -n1;
            dpkg-query -W tar gzip jq git python3 cmake gcc make libc6; } \
            > "$RUNNER_TEMP/artifacts/build-environment.txt"
          (cd "$(dirname "$USIGN_BIN")" && sha256sum usign) > "$RUNNER_TEMP/artifacts/usign-binary.sha256"
          jq -n --slurpfile source "$RUNNER_TEMP/source-identity.json" \
            --arg image_os "${ImageOS:?}" --arg image_version "${ImageVersion:?}" \
            --arg runner_arch "$RUNNER_ARCH" --arg runner_os "$RUNNER_OS" \
            --arg builder_sha256 "$(sha256sum scripts/build-openwrt-ipks.sh | cut -d' ' -f1)" \
            --arg signer_commit c4c72b1b07945ee192361dc751291a7c98d6adcd \
            '{source:$source[0],runner_image_os:$image_os,runner_image_version:$image_version,
              runner_arch:$runner_arch,runner_os:$runner_os,package_builder_sha256:$builder_sha256,
              usign_source_commit:$signer_commit,
              feed_inputs:"Repository-generated feed containing exactly the three project IPKs; no external feed or SDK"}' \
            > "$RUNNER_TEMP/artifacts/build-inputs.json"
      - uses: actions/upload-artifact@v4
        with:
          name: package-build-${{ matrix.side }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 30

  compare-packages:
    needs: [source-preflight, canonical-ipks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-build-a-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@v4
        with:
          name: package-build-b-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/b
      - name: Require exact independent package and feed byte equality
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ needs.source-preflight.outputs.verified_tree }}
        run: |
          set -eu
          diff -ur "$RUNNER_TEMP/a/ipk" "$RUNNER_TEMP/b/ipk"
          diff -ur "$RUNNER_TEMP/a/feed" "$RUNNER_TEMP/b/feed"
          cmp "$RUNNER_TEMP/a/source-identity.json" "$RUNNER_TEMP/b/source-identity.json"
          test "$(find "$RUNNER_TEMP/a/ipk" -name '*.ipk' -type f | wc -l)" -eq 3
          mkdir -p "$RUNNER_TEMP/a/build-provenance/a" "$RUNNER_TEMP/a/build-provenance/b"
          for side in a b; do
            for file in source-identity.json build-environment.txt usign-binary.sha256 build-inputs.json; do
              cp "$RUNNER_TEMP/$side/$file" "$RUNNER_TEMP/a/build-provenance/$side/$file"
            done
          done
          jq -n --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" \
            --arg inputs_a "$(sha256sum "$RUNNER_TEMP/a/build-inputs.json" | cut -d' ' -f1)" \
            --arg inputs_b "$(sha256sum "$RUNNER_TEMP/b/build-inputs.json" | cut -d' ' -f1)" \
            '{source_sha:$source,source_tree:$tree,independent_checkouts:2,byte_identical:true,
              build_inputs_sha256:{a:$inputs_a,b:$inputs_b}}' \
            > "$RUNNER_TEMP/a/reproducibility.json"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-package-inputs-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/a/
          if-no-files-found: error
          retention-days: 30

  sign-and-stage:
    needs: [source-preflight, compare-packages]
    if: ${{ inputs.custody_confirmed && inputs.custody_record_sha256 != '' }}
    runs-on: ubuntu-24.04
    environment: router-ui-production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-package-inputs-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/canonical
      - name: Sign only retained canonical bytes with the derived production fingerprint
        env:
          RELEASE_SECRET_KEY_DATA: ${{ secrets.ROUTER_UI_USIGN_SECRET_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ needs.source-preflight.outputs.verified_tree }}
          CUSTODY_RECORD_SHA256: ${{ inputs.custody_record_sha256 }}
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          STRICT_RELEASE: '1'
          REQUIRE_IMAGES: '0'
          REQUIRE_MAIN_ANCESTRY: '0'
        run: |
          set -eu
          set +x
          umask 077
          sudo apt-get update
          sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          python3 scripts/verify-router-ui-package-candidate.py source \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --app-version "$APP_VERSION" --package-version "$PACKAGE_VERSION" \
            --channel "$RELEASE_CHANNEL" >/dev/null
          signing_dir="$(mktemp -d /dev/shm/router-ui-signing.XXXXXX)"
          export ROUTER_UI_SIGNING_KEY="$signing_dir/signing-key.sec"
          cleanup_secret() { rm -f "$ROUTER_UI_SIGNING_KEY"; rmdir "$signing_dir"; }
          trap cleanup_secret EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$RELEASE_SECRET_KEY_DATA" > "$ROUTER_UI_SIGNING_KEY"
          unset RELEASE_SECRET_KEY_DATA
          chmod 600 "$ROUTER_UI_SIGNING_KEY"
          export SOURCE_COMMIT="$SOURCE_SHA" EXPECTED_SOURCE_COMMIT="$SOURCE_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export IPK_DIR="$RUNNER_TEMP/canonical/ipk" FEED_DIR="$RUNNER_TEMP/canonical/feed"
          export INSTALLED_SET_DIR="$RUNNER_TEMP/installed-set" OUT_DIR="$RUNNER_TEMP/installed-set"
          export OUT_ROOT="$RUNNER_TEMP/empty-stage-root"
          export RELEASE_DIR="$RUNNER_TEMP/prepared/release-v$APP_VERSION"
          unset FACTORY_PRODUCT_VERSION
          ./scripts/sign-opkg-feed.sh
          ./scripts/stage-installed-package-set.sh
          ./scripts/stage-router-release.sh
          cleanup_secret
          trap - EXIT HUP INT TERM
          test ! -e "$ROUTER_UI_SIGNING_KEY" && test ! -e "$signing_dir"
          python3 scripts/verify-router-ui-package-candidate.py artifacts \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --app-version "$APP_VERSION" --package-version "$PACKAGE_VERSION" \
            --channel "$RELEASE_CHANNEL" --release-dir "$RELEASE_DIR" --usign-bin "$USIGN_BIN" \
            > "$RUNNER_TEMP/prepared/package-candidate.json"
          cp "$RUNNER_TEMP/canonical/reproducibility.json" "$RUNNER_TEMP/prepared/"
          cp -R "$RUNNER_TEMP/canonical/build-provenance" "$RUNNER_TEMP/prepared/"
          jq -n --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" \
            --arg workflow_sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{source_sha:$source,source_tree:$tree,workflow_sha:$workflow_sha,
              workflow_ref:$workflow_ref,repository:$repository,run_id:$run_id,run_attempt:$run_attempt}' \
            > "$RUNNER_TEMP/prepared/workflow-provenance.json"
          jq -n --arg record "$CUSTODY_RECORD_SHA256" \
            '{operator_attested:true,custody_record_sha256:$record}' \
            > "$RUNNER_TEMP/prepared/custody-attestation.json"
          echo 'Private signed package preparation passed; VM and hardware qualification remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-router-ui-package-candidate-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
          retention-days: 30
