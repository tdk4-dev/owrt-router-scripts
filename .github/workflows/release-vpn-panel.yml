name: Release VPN panel

on:
  push:
    tags:
      - "vpn-panel-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          version="$(sed -n '1p' luci-vpn-ui/VERSION | tr -d '\r\n')"
          test "${GITHUB_REF_NAME}" = "vpn-panel-v${version}"

      - name: Build release bundle
        run: ./make-vpn-ui-release-bundle.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n '1p' luci-vpn-ui/VERSION | tr -d '\r\n')"
          gh release create "${GITHUB_REF_NAME}" \
            dist/luci-vpn-ui.tar.gz \
            dist/luci-vpn-ui.tar.gz.sha256 \
            dist/vpn-ui-version.txt \
            --title "VPN Panel ${version}" \
            --notes "OpenWrt LuCI VPN panel ${version} release bundle."
