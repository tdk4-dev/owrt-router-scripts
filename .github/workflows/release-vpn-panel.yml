name: Prepare verified Router UI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string
      publish:
        description: Publish only after the draft round-trip verifies
        required: true
        default: false
        type: boolean
      candidate_artifact_id:
        description: Exact successful pre-tag candidate artifact ID
        required: true
        type: string
      candidate_artifact_zip_sha256:
        description: Exact pre-tag candidate artifact ZIP SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: router-ui-project-vm-global
  cancel-in-progress: false

env:
  APP_VERSION: 0.7.11-rc.12
  PACKAGE_VERSION: 0.7.11~rc12-1
  RELEASE_BASENAME: release-v0.7.11-rc.12
  ROUTER_UI_SIGNING_KEY_ID: production-2026-07

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Resolve annotated tag commit
        id: source
        run: |
          set -eu
          test "$(git cat-file -t "refs/tags/${{ inputs.tag }}")" = tag
          printf 'source_sha=%s\n' "$(git rev-parse '${{ inputs.tag }}^{commit}')" >> "$GITHUB_OUTPUT"

  source-preflight:
    needs: resolve-source
    uses: ./.github/workflows/router-ui-source-preflight.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  canonical-ipks:
    needs: [resolve-source, source-preflight]
    if: ${{ needs.source-preflight.outputs.verified_sha == needs.resolve-source.outputs.source_sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify immutable source identity
        run: |
          test "$(git cat-file -t "refs/tags/${{ inputs.tag }}")" = tag
          version="$(sed -n '1p' luci-vpn-ui/VERSION)"
          package_version="$(sed -n '1p' luci-vpn-ui/PACKAGE_VERSION)"
          test "$version" = "$APP_VERSION"
          test "$package_version" = "$PACKAGE_VERSION"
          test "$(sed -n '1p' luci-vpn-ui/files/usr/share/vpn-ui/version)" = "$APP_VERSION"
          test "${{ inputs.tag }}" = "vpn-panel-v${version}"
          test -z "$(git status --porcelain)"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ inputs.tag }}^{commit}" origin/main
      - name: Install package tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Reproduce canonical IPKs and retain the first build
        env:
          STRICT_RELEASE: "1"
          USIGN_BIN: ${{ runner.temp }}/bin/usign
        run: |
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          BUILD_DIR="$RUNNER_TEMP/ipk-build-a" OUT_DIR="$RUNNER_TEMP/ipk-a" \
            FEED_DIR="$RUNNER_TEMP/feed-a" ./scripts/build-openwrt-ipks.sh
          BUILD_DIR="$RUNNER_TEMP/ipk-build-b" OUT_DIR="$RUNNER_TEMP/ipk-b" \
            FEED_DIR="$RUNNER_TEMP/feed-b" ./scripts/build-openwrt-ipks.sh
          diff -u "$RUNNER_TEMP/ipk-a/router-ui-packages.txt" "$RUNNER_TEMP/ipk-b/router-ui-packages.txt"
          for file in "$RUNNER_TEMP/ipk-a"/*.ipk; do
            cmp -s "$file" "$RUNNER_TEMP/ipk-b/$(basename "$file")"
          done
          diff -ur "$RUNNER_TEMP/feed-a" "$RUNNER_TEMP/feed-b"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/ipk-a/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-opkg-feed
          path: ${{ runner.temp }}/feed-a/
          if-no-files-found: error

  sign-installed-package-set:
    needs: canonical-ipks
    runs-on: ubuntu-24.04
    environment: router-ui-production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-opkg-feed
          path: ${{ runner.temp }}/opkg-feed
      - name: Sign exact feed and installed package rollback set
        env:
          ROUTER_UI_SIGNING_KEY: ${{ runner.temp }}/release.sec
          RELEASE_SECRET_KEY_DATA: ${{ secrets.ROUTER_UI_USIGN_SECRET_KEY }}
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          IPK_DIR: ${{ runner.temp }}/canonical-ipks
          FEED_DIR: ${{ runner.temp }}/opkg-feed
          OUT_DIR: ${{ runner.temp }}/installed-package-set
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          cleanup_secret() { rm -f "$ROUTER_UI_SIGNING_KEY"; }
          trap cleanup_secret EXIT INT TERM
          printf '%s\n' "$RELEASE_SECRET_KEY_DATA" > "$ROUTER_UI_SIGNING_KEY"
          chmod 600 "$ROUTER_UI_SIGNING_KEY"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/sign-opkg-feed.sh
          ./scripts/stage-installed-package-set.sh
          cleanup_secret
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: signed-opkg-feed
          path: ${{ runner.temp }}/opkg-feed/
          if-no-files-found: error

  rd23-stock-image:
    needs: [canonical-ipks, sign-installed-package-set]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set
      - name: Build image only from canonical IPKs
        env:
          TARGET_DIR: mediatek/filogic
          PROFILE: xiaomi_mi-router-ax3000t
          ARTIFACT_PREFIX: premier-router-${{ env.APP_VERSION }}-openwrt-24.10.5-xiaomi-ax3000t-stock
          PROJECT_PACKAGE_DIR: ${{ runner.temp }}/canonical-ipks
          PROJECT_PACKAGE_MANIFEST: ${{ runner.temp }}/canonical-ipks/router-ui-packages.txt
          OUT_DIR: ${{ runner.temp }}/images
          WORK_DIR: ${{ runner.temp }}/imagebuilder
          ROOTFS_PARTSIZE: "0"
          WRITABLE_BUDGET_KIB: "0"
          INSTALLED_PACKAGE_SET_DIR: ${{ runner.temp }}/installed-package-set
        run: |
          sudo apt-get update && sudo apt-get install -y zstd jq
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./build-openwrt-custom-image-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: router-image-rd23-stock
          path: ${{ runner.temp }}/images/
          if-no-files-found: error

  rd23-ubootmod-image:
    needs: [canonical-ipks, sign-installed-package-set]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set
      - name: Build image only from canonical IPKs
        env:
          TARGET_DIR: mediatek/filogic
          PROFILE: xiaomi_mi-router-ax3000t-ubootmod
          ARTIFACT_PREFIX: premier-router-${{ env.APP_VERSION }}-openwrt-24.10.5-xiaomi-ax3000t-ubootmod
          PROJECT_PACKAGE_DIR: ${{ runner.temp }}/canonical-ipks
          PROJECT_PACKAGE_MANIFEST: ${{ runner.temp }}/canonical-ipks/router-ui-packages.txt
          OUT_DIR: ${{ runner.temp }}/images
          WORK_DIR: ${{ runner.temp }}/imagebuilder
          ROOTFS_PARTSIZE: "0"
          WRITABLE_BUDGET_KIB: "0"
          INSTALLED_PACKAGE_SET_DIR: ${{ runner.temp }}/installed-package-set
        run: |
          sudo apt-get update && sudo apt-get install -y zstd jq
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./build-openwrt-custom-image-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: router-image-rd23-ubootmod
          path: ${{ runner.temp }}/images/
          if-no-files-found: error

  x86-image:
    needs: [canonical-ipks, sign-installed-package-set, rd23-stock-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set
      - uses: actions/download-artifact@v4
        with:
          name: router-image-rd23-stock
          path: ${{ runner.temp }}/rd23-stock
      - name: Build x86 with the exact candidate RD23 stock writable extent
        env:
          TARGET_DIR: x86/64
          PROFILE: generic
          ARTIFACT_PREFIX: premier-router-${{ env.APP_VERSION }}-openwrt-24.10.5-x86-64
          PROJECT_PACKAGE_DIR: ${{ runner.temp }}/canonical-ipks
          PROJECT_PACKAGE_MANIFEST: ${{ runner.temp }}/canonical-ipks/router-ui-packages.txt
          INSTALLED_PACKAGE_SET_DIR: ${{ runner.temp }}/installed-package-set
          OUT_DIR: ${{ runner.temp }}/images
          WORK_DIR: ${{ runner.temp }}/imagebuilder
          ROOTFS_PARTSIZE: 128
        run: |
          sudo apt-get update && sudo apt-get install -y zstd jq
          stock_archive="$(find "$RUNNER_TEMP/rd23-stock" -maxdepth 1 -type f -name '*xiaomi-ax3000t-stock.tar.gz' | sed -n '1p')"
          test -n "$stock_archive"
          provenance_member="$(tar -tzf "$stock_archive" | awk '/\/image-provenance\.json$/ && !found {print; found=1}')"
          test -n "$provenance_member"
          export WRITABLE_BUDGET_KIB="$(tar -xOzf "$stock_archive" "$provenance_member" |
            jq -er '.rd23_storage_layout.rootfs_data_volume_kib')"
          test "$WRITABLE_BUDGET_KIB" -gt 0
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./build-openwrt-custom-image-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: router-image-x86-64
          path: ${{ runner.temp }}/images/
          if-no-files-found: error

  assemble-and-sign:
    needs: [canonical-ipks, sign-installed-package-set, rd23-stock-image, rd23-ubootmod-image, x86-image]
    runs-on: ubuntu-24.04
    environment: router-ui-production-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-router-ui-ipks
          path: ${{ runner.temp }}/canonical-ipks
      - uses: actions/download-artifact@v4
        with:
          name: signed-opkg-feed
          path: ${{ runner.temp }}/opkg-feed
      - uses: actions/download-artifact@v4
        with:
          name: signed-installed-package-set
          path: ${{ runner.temp }}/installed-package-set
      - uses: actions/download-artifact@v4
        with:
          pattern: router-image-*
          path: ${{ runner.temp }}/stage-root
          merge-multiple: true
      - name: Install pinned release signing tool
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assemble, sign, and strictly validate flat assets
        env:
          ROUTER_UI_SIGNING_KEY: ${{ runner.temp }}/release.sec
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          IPK_DIR: ${{ runner.temp }}/canonical-ipks
          FEED_DIR: ${{ runner.temp }}/opkg-feed
          INSTALLED_SET_DIR: ${{ runner.temp }}/installed-package-set
          OUT_ROOT: ${{ runner.temp }}/stage-root
          RELEASE_DIR: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
          STRICT_RELEASE: "1"
          REQUIRE_IMAGES: "1"
          RELEASE_SECRET_KEY_DATA: ${{ secrets.ROUTER_UI_USIGN_SECRET_KEY }}
        run: |
          cleanup_secret() { rm -f "$ROUTER_UI_SIGNING_KEY"; }
          trap cleanup_secret EXIT INT TERM
          printf '%s\n' "$RELEASE_SECRET_KEY_DATA" > "$ROUTER_UI_SIGNING_KEY"
          chmod 600 "$ROUTER_UI_SIGNING_KEY"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export EXPECTED_SOURCE_COMMIT="$SOURCE_COMMIT"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-router-release.sh
          ./scripts/validate-staged-release.sh
          cleanup_secret
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@v4
        with:
          name: verified-flat-release
          path: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}/
          if-no-files-found: error

  verify-pretag-candidate:
    needs: assemble-and-sign
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-flat-release
          path: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
      - name: Install immutable artifact verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake jq unzip
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download the successful pre-tag candidate and compare every release byte
        env:
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_ZIP_SHA256: ${{ inputs.candidate_artifact_zip_sha256 }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          ./tests/vm/download-immutable-actions-artifact.sh candidate \
            "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_ZIP_SHA256" \
            "$RUNNER_TEMP/pretag-candidate" "$RUNNER_TEMP/pretag-candidate-descriptor.json"
          test "$(jq -r .product_source_sha "$RUNNER_TEMP/pretag-candidate-descriptor.json")" = "$source_sha"
          pretag_release="$RUNNER_TEMP/pretag-candidate/$RELEASE_BASENAME"
          test -d "$pretag_release"
          (cd "$pretag_release" && find . -type f -print | sort) > "$RUNNER_TEMP/pretag-files"
          (cd "$RUNNER_TEMP/$RELEASE_BASENAME" && find . -type f -print | sort) > "$RUNNER_TEMP/tagged-files"
          cmp -s "$RUNNER_TEMP/pretag-files" "$RUNNER_TEMP/tagged-files"
          while IFS= read -r file; do
            cmp -s "$pretag_release/$file" "$RUNNER_TEMP/$RELEASE_BASENAME/$file"
          done < "$RUNNER_TEMP/pretag-files"
          diff -u "$pretag_release/router-ui-packages.txt" \
            "$RUNNER_TEMP/$RELEASE_BASENAME/router-ui-packages.txt"
          for ipk in "$RUNNER_TEMP/$RELEASE_BASENAME"/*.ipk; do
            cmp -s "$ipk" "$pretag_release/$(basename "$ipk")"
          done
          test -d "$RUNNER_TEMP/pretag-candidate/synthetic-next"
      - name: Prepare immutable tagged VM input
        env:
          USIGN_BIN: ${{ runner.temp }}/bin/usign
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tagged-vm-input"
          cp -a "$RUNNER_TEMP/pretag-candidate/synthetic-next" \
            "$RUNNER_TEMP/tagged-vm-input/synthetic-next"
          cp "$RUNNER_TEMP/pretag-candidate-descriptor.json" \
            "$RUNNER_TEMP/tagged-vm-input/pretag-candidate-descriptor.json"
          ./tests/vm/write-candidate-content-descriptor.sh \
            "$RUNNER_TEMP/$RELEASE_BASENAME" \
            "$RUNNER_TEMP/tagged-vm-input/synthetic-next" \
            "$RUNNER_TEMP/tagged-vm-input/tagged-content-descriptor.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-router-ui-vm-input-${{ inputs.tag }}
          path: ${{ runner.temp }}/tagged-vm-input/
          if-no-files-found: error
          retention-days: 30

  tagged-vm-shards:
    name: Disabled diagnostic tagged QEMU shard - ${{ matrix.shard }}
    if: ${{ false }}
    needs: verify-pretag-candidate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [legacy, protocol-concurrency-storage, faults-a, faults-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Initialize independent shard evidence
        run: |
          source_sha="$(git rev-parse HEAD)"
          printf 'TAGGED_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tagged-evidence/${{ matrix.shard }}"
          jq -n --arg shard '${{ matrix.shard }}' --arg source "$source_sha" \
            '{schema_version:1,shard:$shard,candidate_source_sha:$source,complete:false}' \
            > "$RUNNER_TEMP/tagged-evidence/${{ matrix.shard }}/shard-identity.json"
      - uses: actions/download-artifact@v4
        with:
          name: verified-flat-release
          path: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
      - uses: actions/download-artifact@v4
        with:
          name: tagged-router-ui-vm-input-${{ inputs.tag }}
          path: ${{ runner.temp }}/tagged-vm-input
      - name: Download and verify the exact complete legacy baseline pack
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_pack_artifact_id }}
          BASELINE_ARTIFACT_ZIP_SHA256: ${{ inputs.baseline_pack_artifact_zip_sha256 }}
        run: |
          set -Eeuo pipefail
          ./tests/vm/download-immutable-actions-artifact.sh baseline \
            "$BASELINE_ARTIFACT_ID" "$BASELINE_ARTIFACT_ZIP_SHA256" \
            "$RUNNER_TEMP/baseline-input" "$RUNNER_TEMP/baseline-descriptor.json"
          pack="$RUNNER_TEMP/baseline-input/legacy-baseline-pack"
          jq -e '
            .verified == true and
            ([.baselines[] | select(.storage_profile == "rd23-stock") | .version] | sort) ==
              (["0.5.1","0.5.2","0.6.0","0.7.0","0.7.1","0.7.2","0.7.3",
                "0.7.4","0.7.5","0.7.6","0.7.8","0.7.9","0.7.10"] | sort) and
            any(.baselines[]; .storage_profile == "rd23-ubootmod" and .version == "0.7.10") and
            all(.baselines[]; .self_validation.ok == true)
          ' "$pack/baseline-pack-manifest.json" >/dev/null
          printf 'BASELINE_PACK_DIR=%s\n' "$pack" >> "$GITHUB_ENV"
      - name: Install VM and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils jq openssl zstd cmake nodejs npm
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          if test '${{ matrix.shard }}' = legacy; then
            npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.55.1
            npx --prefix "$RUNNER_TEMP/playwright" playwright install --with-deps chromium
          fi
      - name: Run the assigned immutable-byte tagged VM shard
        env:
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          RELEASE_DIR: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
          SYNTHETIC_DIR: ${{ runner.temp }}/tagged-vm-input/synthetic-next
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          ROUTER_UI_BASELINE_PACK_DIR: ${{ env.BASELINE_PACK_DIR }}
          ROUTER_UI_BASELINE_PACK_DIGEST: sha256:${{ inputs.baseline_pack_artifact_zip_sha256 }}
          ROUTER_UI_VM_HARNESS_SHA: ${{ env.TAGGED_SOURCE_SHA }}
          ROUTER_UI_VM_PHASE_TIMEOUT_SECONDS: "2400"
          ROUTER_UI_VM_DIAGNOSTIC: "1"
          CANDIDATE_SOURCE_SHA: ${{ env.TAGGED_SOURCE_SHA }}
        run: |
          set -Eeuo pipefail
          x86_archive="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*x86-64.tar.gz' | sed -n '1p')"
          test -n "$x86_archive"
          export X86_IMAGE_ARCHIVE="$x86_archive"
          shard='${{ matrix.shard }}'
          shard_root="$RUNNER_TEMP/tagged-evidence/$shard"
          mkdir -p "$shard_root"
          run_case() {
            local label="$1" case_name="$2" phase="${3:-all}" boundary="${4:-}"
            local case_root="$shard_root/$label"
            local vm_work_root="$RUNNER_TEMP/vm-work-$label"
            mkdir -p "$case_root" "$vm_work_root/overlays"
            ln -s "$ROUTER_UI_BASELINE_PACK_DIR/bases" "$vm_work_root/bases"
            EVIDENCE_DIR="$case_root" TMPDIR="$vm_work_root/overlays" \
              ROUTER_UI_VM_CASE="$case_name" ROUTER_UI_VM_PHASE="$phase" \
              ROUTER_UI_VM_FAULT_BOUNDARY="$boundary" \
              ./tests/vm/router-ui-vm-gate.sh
            cp "$RUNNER_TEMP/baseline-descriptor.json" "$case_root/"
          }
          case "$shard" in
            legacy)
              run_case old-worker old-worker
              run_case rescue rescue
              run_case refusals rescue refusals
              run_case clean-image clean-image
              ;;
            protocol-concurrency-storage)
              run_case dual-daemon dual-daemon
              run_case protocol-v2 protocol-v2
              run_case concurrency concurrency
              run_case storage storage
              ;;
            faults-a)
              for boundary in before-mutation snapshot_ready applying \
                after-premier-router-core after-luci-app-premier-router \
                after-premier-router-setup validating committing; do
                run_case "fault-$boundary" fault all "$boundary"
              done
              ;;
            faults-b)
              for boundary in rollback_pending rolling_back \
                rollback-after-premier-router-core rollback-after-luci-app-premier-router \
                rollback-after-premier-router-setup compatibility-cleanup post-reboot-validation; do
                run_case "fault-$boundary" fault all "$boundary"
              done
              ;;
          esac
          ./tests/vm/write-candidate-content-descriptor.sh \
            "$RELEASE_DIR" "$SYNTHETIC_DIR" "$shard_root/candidate-content-descriptor.json"
          cp "$RUNNER_TEMP/tagged-vm-input/pretag-candidate-descriptor.json" "$shard_root/"
          jq '.complete = true' "$shard_root/shard-identity.json" \
            > "$shard_root/shard-identity.json.new"
          mv "$shard_root/shard-identity.json.new" "$shard_root/shard-identity.json"
          (cd "$shard_root" && find . -type f ! -name shard-files-sha256sums -print |
            LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > shard-files-sha256sums)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagged-router-ui-vm-evidence-${{ matrix.shard }}-${{ inputs.tag }}
          path: ${{ runner.temp }}/tagged-evidence/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  aggregate-tagged-vm-evidence:
    name: Disabled diagnostic tagged QEMU aggregation
    if: ${{ false }}
    needs: [verify-pretag-candidate, tagged-vm-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Initialize aggregation evidence
        env:
          BYTE_VERIFICATION_RESULT: ${{ needs.verify-pretag-candidate.result }}
          SHARDS_RESULT: ${{ needs.tagged-vm-shards.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/tagged-evidence"
          jq -n --arg bytes "$BYTE_VERIFICATION_RESULT" --arg shards "$SHARDS_RESULT" \
            '{schema_version:1,byte_verification_result:$bytes,shards_result:$shards,complete:false}' \
            > "$RUNNER_TEMP/tagged-evidence/aggregation-input.json"
      - uses: actions/download-artifact@v4
        with:
          name: verified-flat-release
          path: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tagged-router-ui-vm-evidence-*-${{ inputs.tag }}
          path: ${{ runner.temp }}/vm-shards
      - name: Require every shard and aggregate all mandatory evidence
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/vm-shards
          RELEASE_DIR: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
          OUT_DIR: ${{ runner.temp }}/tagged-evidence
          EXPECTED_BASELINE_DIGEST: sha256:${{ inputs.baseline_pack_artifact_zip_sha256 }}
          BYTE_VERIFICATION_RESULT: ${{ needs.verify-pretag-candidate.result }}
          SHARDS_RESULT: ${{ needs.tagged-vm-shards.result }}
        run: |
          set -Eeuo pipefail
          test "$BYTE_VERIFICATION_RESULT" = success
          test "$SHARDS_RESULT" = success
          ./tests/vm/aggregate-candidate-evidence.sh
          cp "$RELEASE_DIR/router-release-manifest.json" "$OUT_DIR/"
          cp "$RELEASE_DIR/router-ui-packages.txt" "$OUT_DIR/"
          (cd "$RELEASE_DIR" && sha256sum ./* | sed 's#  \./#  #' > "$OUT_DIR/tagged-asset-sha256sums")
          (cd "$OUT_DIR" && find . -maxdepth 1 -type f ! -name evidence-files-sha256sums -print |
            LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > evidence-files-sha256sums)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagged-router-ui-aggregated-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/tagged-evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  draft-round-trip:
    needs: verify-pretag-candidate
    runs-on: ubuntu-24.04
    environment: router-ui-production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-flat-release
          path: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
      - name: Install pinned release verification tool
        run: |
          sudo apt-get update && sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create draft, download, verify, and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ inputs.tag }}
          RELEASE_DIR: ${{ runner.temp }}/${{ env.RELEASE_BASENAME }}
          USIGN_BIN: ${{ runner.temp }}/bin/usign
          PUBLISH_VERIFIED_RELEASE: ${{ inputs.publish && '1' || '0' }}
        run: |
          git fetch origin main --no-tags
          ./publish-vpn-panel-release.sh
