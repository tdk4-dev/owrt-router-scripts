name: Verify retained Router UI package candidate (no publication)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact product source SHA of the prepared artifact
        required: true
        type: string
      app_version:
        description: Expected application version
        required: true
        default: 0.7.11-rc.20
        type: string
      package_version:
        description: Expected opkg version
        required: true
        default: 0.7.11~rc20-1
        type: string
      channel:
        description: Expected channel
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
      artifact_id:
        description: Immutable prepared package artifact ID
        required: true
        type: string
      artifact_zip_sha256:
        description: Independently retained SHA-256 of the artifact ZIP
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  APP_VERSION: ${{ inputs.app_version }}
  PACKAGE_VERSION: ${{ inputs.package_version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject malformed source and immutable artifact inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_ZIP_SHA256: ${{ inputs.artifact_zip_sha256 }}
        run: |
          set -eu
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_ZIP_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          case "$APP_VERSION:$PACKAGE_VERSION:$RELEASE_CHANNEL" in
            0.7.11-rc.20:0.7.11~rc20-1:candidate|0.7.11:0.7.11-1:stable) ;;
            *) echo 'Unsupported expected package-candidate identity' >&2; exit 1 ;;
          esac

  source-preflight:
    needs: validate-inputs
    uses: ./.github/workflows/router-ui-source-preflight.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  verify-retained:
    needs: [validate-inputs, source-preflight]
    if: ${{ needs.source-preflight.outputs.verified_sha == inputs.source_sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Download only the exact successful prepared package artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_ZIP_SHA256: ${{ inputs.artifact_zip_sha256 }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          jq -e --arg id "$ARTIFACT_ID" --arg source "$SOURCE_SHA" '
            (.id | tostring) == $id and .expired == false and
            .name == ("prepared-router-ui-package-candidate-" + $source) and
            .workflow_run.head_sha == $source
          ' "$RUNNER_TEMP/artifact.json" >/dev/null
          run_id="$(jq -er '.workflow_run.id' "$RUNNER_TEMP/artifact.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/preparation-run.json"
          jq -e --arg source "$SOURCE_SHA" '
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "success" and .head_sha == $source and
            .path == ".github/workflows/validate-router-ui-candidate.yml"
          ' "$RUNNER_TEMP/preparation-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/preparation-jobs.json"
          jq -e '.jobs as $jobs |
            (.total_count == ($jobs | length)) and
            all(["validate-inputs", "canonical-ipks-a", "canonical-ipks-b",
                 "compare-packages", "sign-and-stage"][];
              . as $name | any($jobs[]; .name == $name and .conclusion == "success"))
          ' "$RUNNER_TEMP/preparation-jobs.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/prepared.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/prepared.zip" | sha256sum -c -
          python3 -I - <<'PY'
          import os, pathlib, stat, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'prepared.zip') as archive:
              entries = archive.infolist()
              assert 0 < len(entries) <= 128
              assert sum(item.file_size for item in entries) < 64 * 1024 * 1024
              assert len({item.filename for item in entries}) == len(entries)
              for item in entries:
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '\\' not in item.filename
                  mode = item.external_attr >> 16
                  assert not stat.S_ISLNK(mode)
                  assert stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR)
              archive.extractall(root / 'prepared')
          PY
      - name: Verify retained signatures, source, scope and reproducibility descriptor
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ needs.source-preflight.outputs.verified_tree }}
          USIGN_BIN: ${{ runner.temp }}/bin/usign
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y jq cmake
          USIGN_INSTALL_DIR="$RUNNER_TEMP/bin" ./scripts/install-ci-usign.sh
          release="$RUNNER_TEMP/prepared/release-v$APP_VERSION"
          python3 scripts/verify-router-ui-package-candidate.py artifacts \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --app-version "$APP_VERSION" --package-version "$PACKAGE_VERSION" \
            --channel "$RELEASE_CHANNEL" --release-dir "$release" --usign-bin "$USIGN_BIN" \
            > "$RUNNER_TEMP/verified-package-candidate.json"
          cmp "$RUNNER_TEMP/prepared/package-candidate.json" "$RUNNER_TEMP/verified-package-candidate.json"
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" '
            .source_sha == $source and .source_tree == $tree and
            .independent_checkouts == 2 and .byte_identical == true
          ' "$RUNNER_TEMP/prepared/reproducibility.json" >/dev/null
          for side in a b; do
            provenance="$RUNNER_TEMP/prepared/build-provenance/$side"
            for file in source-identity.json build-environment.txt usign-binary.sha256 build-inputs.json; do
              test -s "$provenance/$file"
            done
            jq -e --arg side "$side" --arg digest "$(sha256sum "$provenance/build-inputs.json" | cut -d' ' -f1)" \
              '.build_inputs_sha256[$side] == $digest' "$RUNNER_TEMP/prepared/reproducibility.json" >/dev/null
            jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" \
              --arg app "$APP_VERSION" --arg package "$PACKAGE_VERSION" --arg channel "$RELEASE_CHANNEL" '
              .source_sha == $source and .source_tree == $tree and
              .app_version == $app and .package_version == $package and .channel == $channel
            ' "$provenance/source-identity.json" >/dev/null
            jq -e --slurpfile source "$provenance/source-identity.json" '
              .source == $source[0] and .runner_image_os == "ubuntu24" and
              (.runner_image_version | length > 0) and
              .usign_source_commit == "c4c72b1b07945ee192361dc751291a7c98d6adcd" and
              .feed_inputs == "Repository-generated feed containing exactly the three project IPKs; no external feed or SDK"
            ' "$provenance/build-inputs.json" >/dev/null
            grep -Eq '^[0-9a-f]{64}  usign$' "$provenance/usign-binary.sha256"
          done
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE" \
            --arg repository "$GITHUB_REPOSITORY" --slurpfile run "$RUNNER_TEMP/preparation-run.json" '
            .source_sha == $source and .source_tree == $tree and .workflow_sha == $source and
            .repository == $repository and .run_id == ($run[0].id | tostring) and
            .run_attempt == ($run[0].run_attempt | tostring) and
            (.workflow_ref | startswith($repository + "/.github/workflows/validate-router-ui-candidate.yml@"))
          ' "$RUNNER_TEMP/prepared/workflow-provenance.json" >/dev/null
          jq -e '.operator_attested == true and
            (.custody_record_sha256 | test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/prepared/custody-attestation.json" >/dev/null
          echo 'Retained package bytes verified. This is not VM, hardware, or publication approval.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retained-package-verification-${{ inputs.source_sha }}-${{ inputs.artifact_id }}
          path: |
            ${{ runner.temp }}/verified-package-candidate.json
            ${{ runner.temp }}/artifact.json
            ${{ runner.temp }}/preparation-run.json
            ${{ runner.temp }}/preparation-jobs.json
          if-no-files-found: error
          retention-days: 30
